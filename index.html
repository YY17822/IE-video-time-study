<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE 工時影片分析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">IE 工時影片分析</h1>
    <span class="version" title="程式版本">v0.5</span>
    <button id="btnOpen" class="btn primary" title="開啟影片；要繼續舊的分析，請同時選取影片和專案檔（⌘O）">開啟</button>
    <button id="btnSave" class="btn" title="儲存專案檔（⌘S）" disabled>儲存</button>
    <button id="btnSaveAs" class="btn" title="另存新檔（⇧⌘S）" disabled>另存新檔</button>
    <button id="btnExcel" class="btn" title="把片段表匯出成 Excel 檔" disabled>匯出 Excel</button>
    <span id="fileName" class="file-name">尚未開啟影片</span>
    <span id="saveStatus" class="save-status"></span>
    <span id="frameInfo" class="frame-info"></span>
  </header>

  <main class="layout">
    <section class="stage">
      <div id="videoWrap" class="video-wrap">
        <video id="video" playsinline preload="auto"></video>
        <div id="dropHint" class="drop-hint">
          <p>按「開啟」或把影片拖曳到這裡，開始新的分析</p>
          <p class="sub">要繼續舊的分析：同時選取影片和它的專案檔（按住 ⌘ 點選兩個檔案），<br>或只開啟專案檔，再依提示選擇影片</p>
          <p class="sub">影片只在這台電腦上處理，不會上傳到任何地方</p>
        </div>
        <div id="alertBox" class="alert" hidden>
          <p id="alertText"></p>
          <button id="alertClose" class="btn">知道了</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </div>

      <div id="timeline" class="timeline" title="點擊或拖曳以跳到該時間">
        <div id="tlSegments" class="tl-segments"></div>
        <div id="tlPlayhead" class="tl-playhead"></div>
      </div>

      <div class="controls">
        <button id="btnBack1s" class="btn icon" title="後退 1 秒（←）" disabled>−1秒</button>
        <button id="btnPrev" class="btn icon" title="後退 1 幀（Shift + ←）" disabled>◀︎|</button>
        <button id="btnPlay" class="btn icon play" title="播放 / 暫停（Space）" disabled>▶︎</button>
        <button id="btnNext" class="btn icon" title="前進 1 幀（Shift + →）" disabled>|▶︎</button>
        <button id="btnFwd1s" class="btn icon" title="前進 1 秒（→）" disabled>+1秒</button>
        <span class="time"><span id="timeNow">00:00.00</span> / <span id="timeTotal">00:00.00</span></span>
        <span id="frameNow" class="frame-now"></span>
        <span class="spacer"></span>
        <button id="btnUndo" class="btn" title="復原（⌘Z）" disabled>復原</button>
        <button id="btnRedo" class="btn" title="重做（⇧⌘Z）" disabled>重做</button>
        <button id="btnMerge" class="btn" title="把目前選取的片段併入上一段（M）" disabled>合併</button>
        <button id="btnSplit" class="btn accent" title="在目前這一幀分割（S）" disabled>分割</button>
        <label class="speed">倍速
          <select id="speedSel" disabled>
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <h2>分割片段</h2>
        <span id="segSummary" class="summary"></span>
      </div>
      <div class="table-wrap">
        <table class="seg-table">
          <thead>
            <tr>
              <th class="c-no">#</th>
              <th class="c-time">開始</th>
              <th class="c-time">結束</th>
              <th class="c-num">時長(分:秒)</th>
              <th class="c-num">時長(秒)</th>
              <th>動作備註</th>
            </tr>
          </thead>
          <tbody id="segBody"></tbody>
        </table>
        <p id="emptyHint" class="empty-hint">開啟影片後，播放到動作切換處按 <kbd>S</kbd> 分割。</p>
      </div>
    </aside>
  </main>

  <footer class="keys">
    <span class="key" data-key="play"><kbd>Space</kbd>播放／暫停</span>
    <span class="key" data-key="split"><kbd>S</kbd>分割</span>
    <span class="key" data-key="sec"><kbd>←</kbd><kbd>→</kbd>前後 1 秒</span>
    <span class="key" data-key="frame"><kbd>⇧</kbd>+<kbd>←→</kbd>前後 1 幀</span>
    <span class="key" data-key="speed"><kbd>↑</kbd><kbd>↓</kbd>倍速</span>
    <span class="key" data-key="undo"><kbd>⌘Z</kbd>復原</span>
    <span class="key" data-key="redo"><kbd>⇧⌘Z</kbd>重做</span>
    <span class="key" data-key="merge"><kbd>M</kbd>合併到上一段</span>
    <span class="key" data-key="delete"><kbd>Delete</kbd>刪除目前片段</span>
    <span class="key" data-key="note"><kbd>Enter</kbd>寫備註</span>
    <span class="key" data-key="save"><kbd>⌘S</kbd>儲存</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
